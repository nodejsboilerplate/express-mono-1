  /resend/webhook:
    post:
      operationId: resendWebhook
      summary: Resend delivery-event webhook (svix-signed) — inferred from ResendService, confirm against resend.route.ts
      tags: [System]
      security: []
      parameters:
        - name: svix-id
          in: header
          required: true
          schema: { type: string }
        - name: svix-timestamp
          in: header
          required: true
          schema: { type: string }
        - name: svix-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                description: "Resend WebhookEventPayload (email.sent, email.bounced, etc.)",
              }
      responses:
        "200":
          description: Webhook accepted.
        "400":
          description: Missing svix headers, or signature verification failed.
          $ref: "#/components/responses/ValidationError"
        "500":
          description: RESEND_WEBHOOK_SECRET not configured server-side.
          $ref: "#/components/responses/InternalServerError"
